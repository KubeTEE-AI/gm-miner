# SPDX-License-Identifier: Apache-2.0
[package]
name = "sev"
version = "7.1.0"
authors = [
    "Nathaniel McCallum <npmccallum@redhat.com>",
    "The VirTEE Project Developers",
]
license = "Apache-2.0"
description = "Library for AMD SEV-SNP, pinned at the CoCo v0.23.0 lockfile revision"
edition = "2018"
homepage = "https://github.com/virtee/sev"
repository = "https://github.com/virtee/sev"
readme = "README.md"
rust-version = "1.85.0"

[lib]
name = "sev"
path = "src/lib.rs"
doc = false

[features]
default = []
snp = []
serde = ["dep:serde", "dep:serde-big-array", "dep:serde_bytes"]
crypto_nossl = ["dep:p384", "dep:rsa", "dep:sha2", "dep:x509-cert"]

[target.'cfg(target_os = "linux")'.dependencies]
iocuddle = "^0.1"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
bitflags = "2.9.0"
dirs = "^6.0"
serde-big-array = { version = "0.5.1", optional = true }
static_assertions = "^1.1.0"
bitfield = "^0.19"
uuid = { version = "^1.11", features = ["serde"] }
hex = "0.4.3"
libc = "0.2.172"
lazy_static = "1.4.0"
p384 = { version = "0.13.0", optional = true }
rsa = { version = "0.9.6", optional = true }
sha2 = { version = "0.10.9", optional = true }
x509-cert = { version = "0.2.5", optional = true }
byteorder = "1.4.3"
base64 = "0.22.1"
serde_bytes = { version = "0.11.19", optional = true }

[lints.rust]
# The trimmed snapshot retains upstream APIs disabled in the minimal feature
# selection. Lint allowances are confined to this dependency, not the consumer.
unused = "allow"
unreachable_patterns = "allow"
unexpected_cfgs = "allow"
