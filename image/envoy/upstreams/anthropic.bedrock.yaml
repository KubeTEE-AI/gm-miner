slots:
  direct_env: BEDROCK_API_KEY
  cloud: true
  no_retry: true

routes:
  - match:
      path: "/v1/messages"
      headers:
        - name: ":method"
          string_match:
            exact: "POST"
        - name: "x-gm-provider"
          string_match:
            exact: "anthropic"
    route:
      cluster: bedrock_mantle_adapter
      timeout: 1800s
    request_headers_to_remove:
      - authorization
      - api-key
      - x-api-key
      - x-goog-api-key
      - x-envoy-retry-on
      - x-envoy-retry-grpc-on
      - x-envoy-max-retries
      - x-envoy-hedge-on-per-try-timeout
    request_headers_to_add:
      - header:
          key: anthropic-version
          value: "2023-06-01"
        append_action: OVERWRITE_IF_EXISTS_OR_ADD

clusters:
  - name: bedrock_mantle_adapter
    type: STATIC
    connect_timeout: 5s
    load_assignment:
      cluster_name: bedrock_mantle_adapter
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8085
