slots:
  direct_env: ENGY_API_KEY
  auth_header: authorization
  auth_prefix: "Bearer "

routes:
  ## GM's MiniMax H3 adapter sends an Engy-native task request. Creating a
  ## video is non-idempotent: never retry the POST after an upstream reset.
  - match:
      path: "/v2/video_generation"
      headers:
        - name: ":method"
          string_match:
            exact: "POST"
        - name: "x-gm-provider"
          string_match:
            exact: "engy"
    route:
      cluster: engy
      host_rewrite_literal: api.engy.ai
      timeout: 1800s
  ## The adapter polls and downloads jobs through the same pinned worker.
  - match:
      prefix: "/v2/query/video_generation/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "engy"
    route:
      cluster: engy
      host_rewrite_literal: api.engy.ai
      timeout: 1800s
  - match:
      prefix: "/v2/video_generation/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "engy"
    route:
      cluster: engy
      host_rewrite_literal: api.engy.ai
      timeout: 1800s
  ##  api.engy.ai serves the OpenAI-compatible surface
  ##  under /v1 itself, so no path rewrite is needed.
  - match:
      prefix: "/"
      headers:
        - name: "x-gm-provider"
          string_match:
            exact: "engy"
    route:
      cluster: engy
      host_rewrite_literal: api.engy.ai
      timeout: 1800s
      retry_policy:
        retry_on: "reset,connect-failure,refused-stream,5xx"
        num_retries: 1

clusters:
  - name: engy
    type: LOGICAL_DNS
    connect_timeout: 10s
    dns_lookup_family: V4_ONLY
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        ## api.engy.ai's edge closes HTTP/2 connections with streams still in
        ## flight, failing every stream on them at once. One request per
        ## connection limits a close to that request, and the connection is
        ## never older than the request it carries.
        common_http_protocol_options:
          max_requests_per_connection: 1
        explicit_http_config:
          http2_protocol_options:
            max_concurrent_streams: 32
            connection_keepalive:
              interval: 30s
              timeout: 10s
    load_assignment:
      cluster_name: engy
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: api.engy.ai
                    port_value: 443
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.engy.ai
        common_tls_context:
          validation_context:
            trusted_ca:
              filename: /etc/ssl/certs/ca-certificates.crt
            match_typed_subject_alt_names:
              - san_type: DNS
                matcher:
                  exact: api.engy.ai
