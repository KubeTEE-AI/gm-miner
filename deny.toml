[advisories]
yanked = "deny"
# `paste` is unmaintained but has no known vulnerability. It enters the
# tree transitively via dstack-sdk -> alloy -> alloy-primitives, which
# the miner's attestation server (attestd) depends on for the dstack
# guest-agent client. There is no fix to adopt until alloy drops the
# dependency upstream; the gm gateway repo carries the same ignore.
ignore = [
    "RUSTSEC-2024-0436",  # paste crate unmaintained (transitive via dstack-sdk)
    # proc-macro-error2 is unmaintained but carries no known vulnerability.
    # It enters the tree transitively via dstack-sdk -> alloy -> the
    # alloy-sol-macro proc-macro chain. No fix to adopt until alloy drops
    # the dependency upstream; the gm gateway repo carries the same ignore.
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained (transitive via dstack-sdk)
    # dstack-sdk 0.1.3 unconditionally pulls Alloy's Ethereum signer, but
    # this workspace only calls its guest-agent RPC client (get_key,
    # get_quote, info and get_tls_key). It never calls ethereum::to_account
    # or Alloy/k256 arithmetic; decoded key bytes feed ed25519-dalek.
    # crypto-bigint >=0.7.6 is patched, but elliptic-curve 0.13.8 requires
    # 0.5.x and the SDK exposes no feature to remove its Ethereum helper.
    # Reviewed source-level non-reachability exception, not a dependency fix:
    # re-audit on SDK/call-site changes; remove after upgrading/removing
    # that dependency, and review by 2026-11-22. The pinned cargo-deny
    # version has no enforced per-advisory expiry/parent restrictions.
    # This does not assess crypto inside the separately deployed guest agent.
    { id = "RUSTSEC-2026-0387", reason = "The locked crypto-bigint 0.5.5 -> elliptic-curve 0.13.8 chain is only used by dstack-sdk's unused Ethereum helper; reassess before using it or changing this dependency graph" },
]

[licenses]
# Subxt's Substrate hashing dependency uses the CC0 public-domain dedication.
exceptions = [{ name = "tiny-keccak", version = "=2.0.2", allow = ["CC0-1.0"] }]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# `gm-azure-verify` is an in-workspace path dependency of two unpublished
# crates, so it carries no version requirement to pin. That is a wildcard by
# cargo-deny's reckoning, but not a supply-chain one — there is no registry
# fetch and nothing a third party can publish into. Wildcards on anything that
# does come from a registry stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
